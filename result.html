<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="upload-page">
    <div class="upload-container">
        <div class="upload-header">
            <h1>INTERVIEW RESULTS</h1>
            <a href="upload.html" class="back-link">← BACK</a>
        </div>
        <div id="result"></div>
    </div>
    <script>
        const groupConfig = {
            Opening: ["Agenda Setting", "Agenda Clarity", "Rapport Building"],
            Conducting: ["Questioning Strategy", "Responsiveness and Active Listening", "Job Relevant Probing", "Time Management", "Risk Management"],
            Closing: ["Closing Quality", "Warmth and Professional Demeanor", "Candidate Question Invitation", "Interview Closing", "Selling Roblox"]
        };
 
        const binaryRules = ["Agenda Setting", "Risk Management", "Candidate Question Invitation", "Interview Closing", "Selling Roblox"];
 
        function getMaxScore(ruleName) {
            return binaryRules.some(b => ruleName.includes(b)) ? 2 : 3;
        }
 
        function renderVisualization(rawData, interviewType) {
            const grouped = { Opening: [], Conducting: [], Closing: [] };
            rawData.forEach(item => {
                const ruleName = item["Rule Name"];
                for (const g in groupConfig) {
                    if (groupConfig[g].some(r => ruleName.includes(r))) {
                        grouped[g].push(item);
                        break;
                    }
                }
            });
 
            const groupStats = {};
            let totalScore = 0;
            let totalMax = 0;
            for (const g of ["Opening", "Conducting", "Closing"]) {
                let score = 0, max = 0;
                grouped[g].forEach(item => {
                    score += item.Result;
                    max += getMaxScore(item["Rule Name"]);
                });
                groupStats[g] = { score, max };
                totalScore += score;
                totalMax += max;
            }
            const pct = totalMax > 0 ? Math.round((totalScore / totalMax) * 100) : 0;
            const dimensionCount = rawData.length;
            const scoreColor = pct >= 80 ? "#1D9E75" : pct >= 60 ? "#BA7517" : "#E24B4A";
 
            // 雷达图坐标
            const cx = 120, cy = 105, R = 85;
            const angles = [-90, 30, 150];
            function pt(r, deg) {
                const rad = (deg * Math.PI) / 180;
                return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
            }
            const outerPts = angles.map(a => pt(R, a));
            const groups = ["Opening", "Closing", "Conducting"];
            const dataPts = groups.map((g, i) => {
                const ratio = groupStats[g].max > 0 ? groupStats[g].score / groupStats[g].max : 0;
                return pt(R * ratio, angles[i]);
            });
            function ptsToStr(pts) {
                return pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
            }
            const grid50 = angles.map(a => pt(R * 0.5, a));
            const grid75 = angles.map(a => pt(R * 0.75, a));
            const labelOffset = R + 18;
            const labelPts = [
                pt(labelOffset, -90),
                pt(labelOffset, 30),
                pt(labelOffset, 150),
            ];
 
            // 条形图
            const barsHtml = rawData.map(item => {
                const isBinary = binaryRules.some(b => item["Rule Name"].includes(b));
                const max = isBinary ? 2 : 3;
                const ratio = item.Result / max;
                let color, label;
                if (isBinary) {
                    color = item.Result === 2 ? "#1D9E75" : "#E24B4A";
                    label = item.Result === 2 ? "2 (✓)" : "1 (✗)";
                } else {
                    color = item.Result === 3 ? "#1D9E75" : item.Result === 2 ? "#378ADD" : "#E24B4A";
                    label = item.Result;
                }
                const shortName = item["Rule Name"].length > 26 ? item["Rule Name"].slice(0, 24) + "…" : item["Rule Name"];
                return `
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;">
                    <div style="width:175px;flex-shrink:0;font-size:12px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${shortName}</div>
                    <div style="flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden;">
                        <div style="width:${Math.round(ratio * 100)}%;height:100%;background:${color};border-radius:4px;"></div>
                    </div>
                    <div style="width:44px;text-align:right;font-size:12px;color:#666;">${label}</div>
                </div>`;
            }).join("");
 
            return `
            <div style="margin-bottom:2rem;">
 
                <!-- Interview Type Banner -->
                <div style="margin-bottom:1.5rem;padding:0.75rem 1.25rem;background:#f8f8f8;border-left:3px solid #000;border-radius:0 8px 8px 0;">
                    <span style="font-size:11px;letter-spacing:0.08em;color:#888;">INTERVIEW TYPE</span>
                    <div style="font-size:15px;font-weight:600;color:#111;margin-top:2px;">${interviewType}</div>
                </div>
 
                <!-- Summary Cards -->
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem;">
                    <div style="background:#f8f8f8;border-radius:8px;padding:1rem;text-align:center;">
                        <div style="font-size:28px;font-weight:500;color:${scoreColor};">${totalScore}<span style="font-size:14px;color:#888;font-weight:400;"> / ${totalMax}</span></div>
                        <div style="font-size:12px;color:#888;margin-top:2px;">Total Score</div>
                    </div>
                    <div style="background:#f8f8f8;border-radius:8px;padding:1rem;text-align:center;">
                        <div style="font-size:28px;font-weight:500;color:${scoreColor};">${pct}%</div>
                        <div style="font-size:12px;color:#888;margin-top:2px;">Score Rate</div>
                    </div>
                    <div style="background:#f8f8f8;border-radius:8px;padding:1rem;text-align:center;">
                        <div style="font-size:28px;font-weight:500;color:#111;">${dimensionCount}</div>
                        <div style="font-size:12px;color:#888;margin-top:2px;">Dimensions</div>
                    </div>
                </div>
 
                <!-- Radar + Bar Chart -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;">
 
                    <!-- Radar -->
                    <div style="background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem;">
                        <div style="font-size:13px;font-weight:500;color:#111;margin-bottom:10px;">Section Overview</div>
                        <svg width="100%" viewBox="0 0 240 210" role="img" aria-label="Section score radar chart">
                            <title>Section Score Radar</title>
                            <polygon points="${ptsToStr(grid50)}" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                            <polygon points="${ptsToStr(grid75)}" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                            <polygon points="${ptsToStr(outerPts)}" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                            ${outerPts.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#e0e0e0" stroke-width="0.5"/>`).join("")}
                            <polygon points="${ptsToStr(dataPts)}" fill="#378ADD" fill-opacity="0.2" stroke="#378ADD" stroke-width="1.5"/>
                            ${dataPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#378ADD"/>`).join("")}
                            <text x="${labelPts[0][0].toFixed(1)}" y="${(labelPts[0][1] - 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#888">Opening</text>
                            <text x="${labelPts[0][0].toFixed(1)}" y="${(labelPts[0][1] + 8).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="#111">${groupStats["Opening"].score}/${groupStats["Opening"].max}</text>
                            <text x="${labelPts[1][0].toFixed(1)}" y="${(labelPts[1][1] - 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#888">Closing</text>
                            <text x="${labelPts[1][0].toFixed(1)}" y="${(labelPts[1][1] + 8).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="#111">${groupStats["Closing"].score}/${groupStats["Closing"].max}</text>
                            <text x="${labelPts[2][0].toFixed(1)}" y="${(labelPts[2][1] - 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#888">Conducting</text>
                            <text x="${labelPts[2][0].toFixed(1)}" y="${(labelPts[2][1] + 8).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="500" fill="#111">${groupStats["Conducting"].score}/${groupStats["Conducting"].max}</text>
                        </svg>
                    </div>
 
                    <!-- Bar Chart -->
                    <div style="background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:1rem;">
                        <div style="font-size:13px;font-weight:500;color:#111;margin-bottom:4px;">Dimension Scores</div>
                        <div style="display:flex;gap:10px;margin-bottom:10px;font-size:11px;color:#888;">
                            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#1D9E75;margin-right:3px;vertical-align:middle;"></span>Excellent</span>
                            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#378ADD;margin-right:3px;vertical-align:middle;"></span>Adequate</span>
                            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#E24B4A;margin-right:3px;vertical-align:middle;"></span>Needs Work</span>
                        </div>
                        ${barsHtml}
                    </div>
 
                </div>
            </div>`;
        }
 
        function renderScoreCards(rawData) {
            const grouped = { Opening: [], Conducting: [], Closing: [] };
            rawData.forEach(item => {
                const ruleName = item["Rule Name"];
                for (const g in groupConfig) {
                    if (groupConfig[g].some(r => ruleName.includes(r))) {
                        grouped[g].push(item);
                        break;
                    }
                }
            });
 
            let html = "";
            for (const groupName of ["Opening", "Conducting", "Closing"]) {
                html += `<h2 class="group-title">${groupName.toUpperCase()} THE INTERVIEW</h2><div class="card-grid">`;
                grouped[groupName].forEach(item => {
                    const rule = item["Rule Name"];
                    const res = item.Result;
                    const reasoning = item.Reasoning || "";
                    const isBinary = binaryRules.some(b => rule.includes(b));
                    const scoreClass = isBinary ? (res === 2 ? "yes-score" : "no-score") : "num-score";
                    const displayScore = isBinary ? (res === 2 ? "2 (✓)" : "1 (✗)") : res;
 
                    html += `
                    <div class="score-card">
                        <div class="card-head">
                            <h3>${rule.toUpperCase()}</h3>
                            <span class="${scoreClass}">${displayScore}</span>
                        </div>
                        <div class="card-sub">${groupName}</div>
                        <div class="card-section">
                            <div class="section-label">REASONING</div>
                            <div class="section-bar"></div>
                            <p>${reasoning}</p>
                        </div>
                        <div class="card-section">
                            <div class="section-label">SUGGESTION</div>
                            <div class="section-bar"></div>
                            <p>${res >= 2 ? "No improvement needed." : "Focus on improving consistency in this area."}</p>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            }
 
            html += `
            <div class="bottom-action">
                <a href="upload.html" class="new-score-btn">SCORE ANOTHER INTERVIEW</a>
                <a href="history.html" class="history-btn">SCORE HISTORY</a>
            </div>`;
 
            return html;
        }
 
        window.addEventListener('load', () => {
            const resultDiv = document.getElementById('result');
            const data = localStorage.getItem('currentResult');
 
            if (!data) {
                resultDiv.innerHTML = "<p>No result found. <a href='upload.html'>Score an interview</a></p>";
                return;
            }
 
            const result = JSON.parse(data);
            const rawData = result.details;
            const interviewType = result.interviewType || "Not Specified";
            const title = result.title || "Untitled Interview";
 
            document.querySelector('h1').textContent = title.toUpperCase();
 
            resultDiv.innerHTML =
                renderVisualization(rawData, interviewType) +
                renderScoreCards(rawData);
        });
    </script>
</body>
</html>
